[build]
  publish = "."
  functions = "netlify/functions"

[dev]
  port = 8888
  targetPort = 3000
  publish = "."
  command = "node server.js"
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/hub"
  to = "/hub.html"
  status = 200

[[redirects]]
  from = "/apply"
  to = "/page3-apply.html"
  status = 200

[[redirects]]
  from = "/offer"
  to = "/page4-offer.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/distributors.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/aios-dashboard.html"
  status = 200
