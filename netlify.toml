[build]
  publish = "."
  functions = "netlify/functions"

[dev]
  port = 8888
  targetPort = 3000
  publish = "."
  command = "node server.js"
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/hub"
  to = "/apex-hub.html"
  status = 200

[[redirects]]
  from = "/apply"
  to = "/apex-apply.html"
  status = 200

[[redirects]]
  from = "/offer"
  to = "/apex-offer.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/apex-join.html"
  status = 200

[[redirects]]
  from = "/start"
  to = "/apex-index.html"
  status = 200
