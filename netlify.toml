[build]
  publish = "."
  functions = "netlify/functions"

[dev]
  port = 8888
  targetPort = 3000
  publish = "."
  command = "node server.js"
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}
